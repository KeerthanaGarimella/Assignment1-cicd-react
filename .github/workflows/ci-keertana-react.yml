name: CI-Pipeline-Keertana

on:
  push:
    branches:
      - keerthana-feature
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run test cases
        run: npm test -- --watchAll=false

      - name: Build the app
        run: npm run build

  docker-steps:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t react-ci-app .

      - name: Run Docker container
        run: docker run -d -p 3000:3000 react-ci-app

      - name: List running containers
        run: docker ps

      - name: Stop Docker container
        run: docker stop $(docker ps -q --filter ancestor=react-ci-app)
